services:
  - type: web
    name: cloader
    runtime: python
    buildCommand: python -m pip install -r requirements.txt && cd web && npm install && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CLOADER_DATA_DIR
        value: /var/data
    disk:
      name: cloader-data
      mountPath: /var/data
      sizeGB: 10
