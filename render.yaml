services:
  - type: web
    name: cloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CLOADER_DATA_DIR
        value: /var/data
      - key: CLOADER_UPLOAD_CONCURRENCY
        value: "2"
      - key: CLOADER_UPLOAD_RETRIES
        value: "2"
    disk:
      name: cloader-data
      mountPath: /var/data
      sizeGB: 10
